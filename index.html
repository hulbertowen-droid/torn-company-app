<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Company Ledger & Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 id="nav-company-name" class="text-xl font-bold text-red-500 uppercase">TORN HQ // VERIFIED LEDGER</h1>
            <span id="connection-status" class="bg-green-950 text-green-400 text-xs font-semibold px-2 py-1 rounded border border-green-700">SYSTEM ONLINE</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 space-y-6">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-gray-800 p-6 rounded-xl border border-gray-700">
            <div><p class="text-gray-400 text-xs uppercase">Daily Income</p><p id="daily-inc" class="text-green-400 font-bold text-lg">$0</p></div>
            <div><p class="text-gray-400 text-xs uppercase">Vault Bankroll</p><p id="vault-funds" class="text-blue-400 font-bold text-lg">$0</p></div>
            <div><p class="text-gray-400 text-xs uppercase">Current Rating</p><p id="comp-rating" class="text-amber-400 font-bold text-lg">1 Star</p></div>
            <div><p class="text-gray-400 text-xs uppercase">Popularity</p><p id="comp-pop" class="text-purple-400 font-bold text-lg">0%</p></div>
        </div>

        <!-- Income Graph -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-[300px]">
            <canvas id="dailyLogChart"></canvas>
        </div>

        <!-- Training Tracker -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h3 class="text-md font-bold text-white mb-4">Automated Training Roster</h3>
            <table class="w-full text-left">
                <thead><tr class="text-gray-400 text-xs uppercase"><th>Name</th><th>Status</th><th>Override</th></tr></thead>
                <tbody id="training-roster-rows"></tbody>
            </table>
        </div>

        <!-- AI Director Experimenter (Realistic) -->
        <div class="bg-gray-900 border border-purple-500 p-6 rounded-xl">
            <h2 class="text-purple-400 font-bold mb-4 uppercase text-lg">AI Director Sandbox (Wiki-Realistic)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <label class="block text-sm">Ad Budget: <input type="range" id="sim-ad" min="0" max="2000000" value="200000" class="w-full" oninput="runSim()"></label>
                    <label class="block text-sm">Effectiveness: <input type="range" id="sim-eff" min="0" max="100" value="100" class="w-full" oninput="runSim()"></label>
                    <p id="sim-stats" class="text-xs text-gray-500">Wiki Engine: 40% Ad Cap applied.</p>
                </div>
                <div class="text-center p-4 bg-gray-800 rounded">
                    <p class="text-sm">30-Day Simulated Net Profit</p>
                    <h3 id="sim-rev" class="text-4xl font-black text-white">$0</h3>
                </div>
            </div>
        </div>
    </main>

    <script>
        let baseline = 0;
        let performanceChart = null;

        // Realistic Simulation Math
        async function runSim() {
            const ad = parseInt(document.getElementById('sim-ad').value);
            const eff = parseInt(document.getElementById('sim-eff').value) / 100;
            
            // 40% Cap from Wiki + Effectiveness quadratic formula
            const adImpact = Math.min(0.40, (ad / 1000000) * 0.40);
            const net = (baseline * (1 + adImpact) * Math.pow(eff, 2)) - ad;
            
            document.getElementById('sim-rev').innerText = `$${Math.round(net * 30).toLocaleString()}`;
        }

        // Standard Pipeline
        async function runDataPipeline() {
            const res = await fetch('/api/company');
            const data = await res.json();
            const comp = data.company;
            baseline = comp.daily_income || comp.daily_profit || 0;
            
            document.getElementById('daily-inc').innerText = `$${Number(baseline).toLocaleString()}`;
            document.getElementById('vault-funds').innerText = `$${Number(comp.funds || 0).toLocaleString()}`;
            document.getElementById('comp-rating').innerText = `${comp.rating} Star`;
            
            runSim();
        }

        window.onload = runDataPipeline;
    </script>
</body>
</html>
