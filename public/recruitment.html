<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment | Spider-Verse</title>
    <style>
        :root { 
            --bg: #090a0f; --card: #11141d; --item: #1b202e; 
            --red: #ff4757; --blue: #58a6ff; --gold: #ffa502;
            --text-main: #f1f2f6; --text-dim: #a1aab5; --green: #2ed573;
        }
        body { background: var(--bg); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0d13; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #57606f; }

        .top-nav { display: flex; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto 20px auto; background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid #2f3542; }
        .nav-link { color: var(--text-dim); text-decoration: none; font-weight: bold; padding: 6px 12px; border-radius: 6px; transition: 0.2s; text-transform: uppercase; font-size: 0.9em; letter-spacing: 1px; cursor: pointer; }
        .nav-link:hover { background: #2f3542; color: white; }
        .nav-link.active { color: white; background: rgba(88, 166, 255, 0.15); border: 1px solid var(--blue); }

        h1 { text-align: center; color: var(--green); text-transform: uppercase; letter-spacing: 3px; font-weight: 900; margin-bottom: 25px; }

        .container { max-width: 1200px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #2f3542; }
        
        .dash-card { background: #0b0d13; border: 1px solid #2f3542; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .dash-header { margin-top: 0; color: var(--text-dim); text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; border-bottom: 1px solid #2f3542; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; }
        
        #war-list-container { max-height: 250px; overflow-y: auto; padding-right: 10px; }

        .war-block { background: var(--card); border: 1px solid #2f3542; padding: 15px 20px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .war-details .title { color: var(--gold); font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .war-details .dates { color: var(--text-dim); font-size: 0.85em; }
        
        .btn-calc { background: var(--blue); color: #000; font-weight: bold; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .btn-calc:hover { background: #79c0ff; }
        .btn-loaded { background: #2f3542; color: var(--text-dim); cursor: default; }
        .btn-loaded:hover { background: #2f3542; }
        
        .btn-msg { background: rgba(88, 166, 255, 0.15); border: 1px solid var(--blue); color: var(--blue); padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 0.8em; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .btn-msg:hover { background: var(--blue); color: #000; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; text-transform: uppercase; display: inline-block;}
        .badge-gone { background: rgba(46, 213, 115, 0.15); color: var(--green); border: 1px solid var(--green); }
        .badge-member { background: rgba(255, 165, 2, 0.15); color: var(--gold); border: 1px solid var(--gold); }

        /* Filter Tabs */
        .filter-group { display: none; gap: 8px; margin-bottom: 15px; align-items: center; justify-content: space-between; border-top: 1px solid #2f3542; padding-top: 20px;}
        .filter-btn { background: #0b0d13; color: var(--text-dim); border: 1px solid #2f3542; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; transition: 0.2s; text-transform: uppercase;}
        .filter-btn:hover { background: #2f3542; color: white; }
        .filter-btn.active { background: rgba(46, 213, 115, 0.15); border-color: var(--green); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; display: none; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2f3542; }
        th { color: var(--green); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .score-val { color: var(--blue); font-weight: bold; }
        .eff-val { color: var(--gold); font-weight: bold; }
        .stat-val { color: var(--text-dim); font-size: 0.9em; font-style: italic;}

        /* Modal Styling */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #2f3542; width: 500px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); position: relative;}
        .modal-content h2 { margin: 0 0 10px 0; color: var(--gold); border-bottom: 1px solid #2f3542; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .modal-content textarea { padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #0b0d13; color: white; font-size: 1em; width: 100%; box-sizing: border-box; min-height: 120px; font-family: inherit; resize: vertical; line-height: 1.5; }
        .modal-content textarea:focus { outline: 1px solid var(--blue); }
        .modal-content button { background: var(--green); color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1em; margin-top: 10px; transition: 0.2s; text-transform: uppercase; }
        .modal-content button:hover { background: #26b361; }
        .modal-content button:disabled { background: #2f3542; color: #57606f; cursor: not-allowed; }
        .close-btn { position: absolute; right: 20px; top: 20px; color: var(--text-dim); cursor: pointer; font-size: 1.5em; line-height: 1; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/" class="nav-link">📡 Live Warboard</a>
        <a href="/payout.html" class="nav-link">💰 Payout Calculator</a>
        <a href="/dashboard.html" class="nav-link">🛡️ Alliance Dashboard</a>
        <a href="/recruitment.html" class="nav-link active">🎯 Recruitment</a>
    </div>

    <h1>Enemy Poaching Scanner</h1>

    <div class="container">
        <div id="error-msg" style="color: var(--red); font-weight: bold; margin-bottom: 15px; text-align: center;"></div>

        <div class="dash-card">
            <div class="dash-header">Select a Past War to Scan</div>
            <div id="war-list-container">
                <div style="color:var(--text-dim);">Loading past wars...</div>
            </div>
        </div>

        <div id="filter-bar" class="filter-group">
            <div style="display:flex; gap:10px;">
                <button id="flt-all" class="filter-btn active" onclick="setRecruitFilter('All')">All Targets</button>
                <button id="flt-factionless" class="filter-btn" onclick="setRecruitFilter('Factionless')">🚨 Factionless / Left Only</button>
            </div>
            <button class="filter-btn" onclick="rescanStats()" style="border-color:var(--blue); color:var(--blue);">🔄 Refresh FFScouter Stats</button>
        </div>

        <table id="recruit-table">
            <thead>
                <tr>
                    <th>Target Player</th>
                    <th>Est. Stats</th>
                    <th>War Score</th>
                    <th>Hits</th>
                    <th>Efficiency (Score/Hit)</th>
                    <th>Current Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="recruit-list"></tbody>
        </table>
    </div>

    <!-- AI Quick Chat Modal -->
    <div id="msg-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="close-btn" onclick="closeMsgModal()">&times;</div>
            <h2 id="modal-title">Drafting Message...</h2>
            <textarea id="ai-msg-box" spellcheck="false">Initializing AI uplink...</textarea>
            <button id="btn-copy-send" onclick="copyAndSend()" disabled>Copy & Open Torn</button>
        </div>
    </div>

<script>
    const myKey = localStorage.getItem("warboard_apikey");
    let currentButtons = [];
    let currentTargetId = null;
    let currentRecruits = [];
    let activeFilter = 'All';
    let currentReportId = null;

    async function fetchWarList() {
        if (!myKey) {
            document.getElementById("error-msg").innerText = "Please set your API key on the Live Warboard settings first.";
            document.getElementById("war-list-container").innerHTML = "";
            return;
        }
        try {
            const res = await fetch(`/api/war-list?apiKey=${myKey}`);
            const data = await res.json();
            const container = document.getElementById("war-list-container");
            
            if (data.error) { container.innerHTML = `<div style="color:var(--red);">API Error: ${data.error}</div>`; return; }

            if (data.wars && data.wars.length > 0) {
                let html = "";
                data.wars.forEach(w => {
                    let dStart = new Date(w.start * 1000).toLocaleDateString();
                    html += `
                        <div class="war-block">
                            <div class="war-details">
                                <div class="title">vs ${w.enemy}</div>
                                <div class="dates">Started: ${dStart}</div>
                            </div>
                            <button id="btn-${w.id}" class="btn-calc" onclick="scanRecruits('${w.id}')">Scan Enemy Faction</button>
                        </div>
                    `;
                    currentButtons.push(`btn-${w.id}`);
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div style="color:var(--text-dim);">No recent completed ranked wars found.</div>`;
            }
        } catch (e) {
            document.getElementById("war-list-container").innerHTML = `<div style="color:var(--red);">Failed to load wars.</div>`;
        }
    }
    
    fetchWarList();

    async function scanRecruits(reportId) {
        currentReportId = reportId;
        document.getElementById("error-msg").innerText = "";
        const table = document.getElementById("recruit-table");
        const list = document.getElementById("recruit-list");
        const filterBar = document.getElementById("filter-bar");
        
        currentButtons.forEach(id => {
            const btn = document.getElementById(id);
            if (btn) { btn.className = "btn-calc"; btn.innerText = "Scan Enemy Faction"; }
        });
        
        const activeBtn = document.getElementById(`btn-${reportId}`);
        activeBtn.innerText = "Scanning...";
        filterBar.style.display = "none";
        table.style.display = "table";
        list.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-dim);">Fetching live faction data and querying FFScouter...</td></tr>`;

        try {
            const res = await fetch(`/api/scan-recruits?apiKey=${myKey}&reportId=${reportId}`);
            const data = await res.json();

            if (data.error) throw new Error(data.error);

            activeBtn.className = "btn-calc btn-loaded";
            activeBtn.innerText = "Scan Complete ✓";
            
            currentRecruits = data.recruits;

            if (currentRecruits.length === 0) {
                list.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-dim);">No poachable heavy-hitters found from this war.</td></tr>`;
                return;
            }

            filterBar.style.display = "flex";
            renderTable();

        } catch (e) {
            activeBtn.innerText = "Error";
            list.innerHTML = "";
            table.style.display = "none";
            document.getElementById("error-msg").innerText = "Failed to scan: " + e.message;
        }
    }

    function setRecruitFilter(filterType) {
        activeFilter = filterType;
        document.getElementById('flt-all').className = "filter-btn";
        document.getElementById('flt-factionless').className = "filter-btn";
        document.getElementById('flt-' + filterType.toLowerCase()).className = "filter-btn active";
        renderTable();
    }

    function rescanStats() {
        if (currentReportId) {
            scanRecruits(currentReportId);
        }
    }

    function renderTable() {
        const list = document.getElementById("recruit-list");
        let html = "";
        
        const filteredRecruits = currentRecruits.filter(r => {
            if (activeFilter === 'All') return true;
            if (activeFilter === 'Factionless' && !r.stillInFaction) return true;
            return false;
        });

        if (filteredRecruits.length === 0) {
            list.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-dim);">No recruits match the current filter.</td></tr>`;
            return;
        }

        filteredRecruits.forEach(r => {
            let badgeClass = r.stillInFaction ? "badge-member" : "badge-gone";
            let daysText = r.stillInFaction ? ` (${r.days} Days)` : "";
            let parsedStats = typeof r.estStats === 'number' ? r.estStats.toLocaleString() : r.estStats;
            let statDisplayClass = parsedStats === "Scanning..." ? "stat-val" : "score-val";

            html += `<tr>
                <td><a href="https://www.torn.com/profiles.php?XID=${r.id}" target="_blank" style="color:var(--text-main); text-decoration:none; font-weight:bold;">${r.name} [${r.id}]</a></td>
                <td class="${statDisplayClass}">${parsedStats}</td>
                <td class="score-val">${r.score}</td>
                <td>${r.attacks}</td>
                <td class="eff-val">${r.efficiency}</td>
                <td><span class="badge ${badgeClass}">${r.status}${daysText}</span></td>
                <td><button class="btn-msg" onclick="openMsgModal('${r.id}', '${r.name}', ${r.score}, ${r.attacks}, '${r.status}')">✉️ Auto-Draft Message</button></td>
            </tr>`;
        });

        list.innerHTML = html;
    }

    // --- QUICK CHAT MODAL LOGIC ---
    function closeMsgModal() {
        document.getElementById("msg-modal").style.display = "none";
    }

    async function openMsgModal(id, name, score, attacks, status) {
        currentTargetId = id;
        document.getElementById("modal-title").innerText = `Drafting DM to ${name}`;
        document.getElementById("ai-msg-box").value = "Analyzing stats and writing recruitment pitch...";
        document.getElementById("btn-copy-send").disabled = true;
        document.getElementById("msg-modal").style.display = "flex";

        try {
            const res = await fetch('/api/generate-recruit-msg', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerName: name, score: score, attacks: attacks, status: status })
            });
            const data = await res.json();
            
            if (data.error) throw new Error(data.error);

            document.getElementById("ai-msg-box").value = data.message;
            document.getElementById("btn-copy-send").disabled = false;

        } catch (e) {
            document.getElementById("ai-msg-box").value = `[ERROR] Failed to connect to Gemini API. \n\nReason: ${e.message}\n\nYou can manually write your message here before copying!`;
            document.getElementById("btn-copy-send").disabled = false; 
        }
    }

    async function copyAndSend() {
        const textToCopy = document.getElementById("ai-msg-box").value;
        try {
            await navigator.clipboard.writeText(textToCopy);
            
            const btn = document.getElementById("btn-copy-send");
            btn.innerText = "✓ Copied! Opening Torn...";
            
            setTimeout(() => {
                window.open(`https://www.torn.com/messages.php?action=send&XID=${currentTargetId}`, '_blank');
                closeMsgModal();
                btn.innerText = "Copy & Open Torn";
            }, 800);
            
        } catch (err) {
            alert("Failed to copy message to clipboard.");
        }
    }
</script>
</body>
</html>
