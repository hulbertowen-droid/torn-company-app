<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="70%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06090e"/>
    </radialGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="spiderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#glowRing)" stroke-width="6" opacity="0.85" filter="url(#neon)"/>
  <circle cx="256" cy="256" r="198" fill="#11161d" stroke="#30363d" stroke-width="2"/>

  <!-- Tactical Radar Grids -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="256" y1="58" x2="256" y2="454" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="58" y1="256" x2="454" y2="256" stroke="#1e293b" stroke-width="1" opacity="0.6"/>

  <!-- Tactical Spider Emblem -->
  <g transform="translate(256, 256)" filter="url(#neon)">
    <!-- Spider Legs (Upper Left) -->
    <path d="M -30 -30 Q -110 -110 -150 -60" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M -35 -10 Q -130 -60 -160 20" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M -35 15 Q -130 50 -145 110" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M -25 35 Q -100 110 -115 160" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

    <!-- Spider Legs (Upper Right) -->
    <path d="M 30 -30 Q 110 -110 150 -60" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 35 -10 Q 130 -60 160 20" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 35 15 Q 130 50 145 110" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M 25 35 Q 100 110 115 160" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

    <!-- Head / Eyes -->
    <ellipse cx="0" cy="-45" rx="22" ry="26" fill="url(#spiderGrad)"/>
    <polygon points="-8,-48 -2,-42 -8,-36" fill="#ffffff"/>
    <polygon points="8,-48 2,-42 8,-36" fill="#ffffff"/>
    <polygon points="-14,-44 -10,-40 -14,-36" fill="#38bdf8"/>
    <polygon points="14,-44 10,-40 14,-36" fill="#38bdf8"/>

    <!-- Thorax & Abdomen -->
    <ellipse cx="0" cy="5" rx="28" ry="24" fill="#d32f2f"/>
    <path d="M 0 15 C -45 50 -55 125 0 150 C 55 125 45 50 0 15 Z" fill="url(#spiderGrad)" stroke="#ff4757" stroke-width="2"/>
    
    <!-- Chest Hourglass Emblem -->
    <polygon points="0,45 -14,75 14,75" fill="#ffffff"/>
    <polygon points="-14,80 14,80 0,110" fill="#ffffff"/>
  </g>

  <!-- Status Light Beacon -->
  <circle cx="256" cy="425" r="7" fill="#00e676" filter="url(#neon)"/>
</svg>