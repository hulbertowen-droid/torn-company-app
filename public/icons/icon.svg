<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fridayBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="65%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Friday Hologram Teal & Emerald Glow -->
    <linearGradient id="fridayTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#70e000"/>
    </linearGradient>

    <linearGradient id="fridayAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#80ed99"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#00bbf9" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0077b6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#fridayBg)"/>
  
  <!-- Outer Tactical Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="url(#fridayTeal)" stroke-width="3" opacity="0.4"/>

  <!-- Holographic AI Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)"/>

  <!-- Orbital HUD Ring 1 (Dotted Tracking Arc) -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00f5d4" stroke-width="3" stroke-dasharray="12,18" opacity="0.65" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="80,25,40,25" opacity="0.75"/>

  <!-- HUD Reticle Ticks & Coordinates -->
  <path d="M 256 32 L 256 56 M 256 456 L 256 480 M 32 256 L 56 256 M 456 256 L 480 256" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 100 100 L 116 116 M 396 396 L 412 412 M 100 412 L 116 396 M 412 100 L 396 116" stroke="#00bbf9" stroke-width="2.5" opacity="0.6"/>

  <!-- Waveform Acoustic / Neural Arcs (Friday Voice Interface) -->
  <g filter="url(#neonGlow)">
    <!-- Top-Right Acoustic Wave -->
    <path d="M 330 160 A 130 130 0 0 1 390 220" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round"/>
    <path d="M 345 145 A 155 155 0 0 1 415 215" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 360 130 A 180 180 0 0 1 440 210" fill="none" stroke="#80ed99" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Bottom-Left Acoustic Wave -->
    <path d="M 182 352 A 130 130 0 0 1 122 292" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round"/>
    <path d="M 167 367 A 155 155 0 0 1 97 297" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 152 382 A 180 180 0 0 1 72 302" fill="none" stroke="#80ed99" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Inner HUD Hex-Lattice / Ring -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="#00f5d4" stroke-width="2.5" opacity="0.5" stroke-dasharray="16,8"/>
  <circle cx="256" cy="256" r="105" fill="#0d1b2a" stroke="url(#fridayTeal)" stroke-width="3.5" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Friday AI Center Core: Futuristic Stylized 'F' Emblem -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    <!-- Holographic Energy Nodes -->
    <circle cx="0" cy="0" r="88" fill="url(#coreGlow)" opacity="0.5"/>
    
    <!-- Stylized Futuristic 'F' Monogram for F.R.I.D.A.Y. -->
    <path d="M -38 -56 L 42 -56 C 48 -56 52 -52 50 -46 L 46 -34 C 44 -28 38 -24 32 -24 L -10 -24 L -10 -2 C -10 -2 22 -2 26 -2 C 32 -2 36 2 34 8 L 30 18 C 28 24 22 28 16 28 L -10 28 L -10 52 C -10 58 -14 62 -20 62 L -34 62 C -40 62 -44 58 -44 52 L -44 -50 C -44 -54 -41 -56 -38 -56 Z" 
          fill="url(#fridayTeal)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Friday AI Node Dots -->
    <circle cx="48" cy="-40" r="4.5" fill="#00f5d4" filter="url(#softGlow)"/>
    <circle cx="32" cy="14" r="4" fill="#80ed99" filter="url(#softGlow)"/>
    <circle cx="-27" cy="58" r="3.5" fill="#38bdf8"/>
    <circle cx="-27" cy="-52" r="3.5" fill="#00f5d4"/>
  </g>

  <!-- Micro HUD Subtext: 'F.R.I.D.A.Y.' -->
  <text x="256" y="420" text-anchor="middle" font-family="'JetBrains Mono', 'Inter', monospace" font-size="20" font-weight="900" fill="#00f5d4" letter-spacing="6" opacity="0.9" filter="url(#softGlow)">F.R.I.D.A.Y.</text>
  <text x="256" y="440" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="3" opacity="0.8">TACTICAL AI • FACTION OS</text>
</svg>