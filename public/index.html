<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Verse Warboard</title>
    <style>
        :root {
            --bg: #050505; --card: #0d1117; --item: #161b22;
            --red: #e11d48; --blue: #2563eb; --gold: #fbbf24;
        }
        body { background: var(--bg); color: #c9d1d9; font-family: 'Inter', system-ui; margin: 0; padding: 20px; }
        h1 { text-align: center; color: var(--red); text-transform: uppercase; letter-spacing: 4px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(225, 29, 72, 0.2); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .col { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #30363d; }
        h2 { color: #8b949e; border-bottom: 2px solid var(--red); padding-bottom: 10px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        ul { list-style: none; padding: 0; }
        li { 
            background: var(--item); margin-bottom: 8px; padding: 10px 16px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        li:hover { transform: scale(1.02); border-color: var(--red); }
        .profile { font-weight: 600; color: #fff; text-decoration: none; }
        .badge { background: #21262d; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--gold); border: 1px solid #444; }
        .timer { font-family: monospace; color: var(--red); font-weight: bold; }
        button { cursor: pointer; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .call { background: var(--red); color: white; }
        .unclaim { background: var(--blue); color: white; }
    </style>
</head>
<body>

    <h1>🕷 Spider-Verse Warboard</h1>

    <div class="grid">
        <div class="col"><h2>🛡 Friendly</h2><ul id="friendly"></ul></div>
        <div class="col"><h2>⚔ Enemy</h2><ul id="enemy"></ul></div>
    </div>

<script>
let myName = localStorage.getItem("warboard_name") || prompt("Torn Name:");
localStorage.setItem("warboard_name", myName);

setInterval(() => {
    document.querySelectorAll(".timer").forEach(el => {
        let left = parseInt(el.dataset.until) - Math.floor(Date.now()/1000);
        el.innerText = left > 0 ? `${Math.floor(left/60)}:${(left%60).toString().padStart(2,"0")}` : "Ready";
    });
}, 1000);

function format(n){
    if(n>1e9) return (n/1e9).toFixed(1)+"b";
    if(n>1e6) return (n/1e6).toFixed(1)+"m";
    return (n/1e3).toFixed(1)+"k";
}

async function load(){
    const res = await fetch("/api/warboard");
    const data = await res.json();
    
    // Update Friendly
    document.getElementById("friendly").innerHTML = data.friendly.map(p => `
        <li>
            <a class="profile" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a>
            ${p.state==="Hospital" ? `<span class="timer" data-until="${p.until}"></span>` : ""}
        </li>`).join("");

    // Update Enemy
    document.getElementById("enemy").innerHTML = data.enemy.sort((a,b)=>(b.intelScore||0)-(a.intelScore||0)).map(p => `
        <li>
            <div>
                <a class="profile" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a>
                ${p.estStats ? `<span class="badge">${format(p.estStats)}</span>` : ""}
            </div>
            <div>
                ${p.state==="Hospital" ? `<span class="timer" data-until="${p.until}"></span> ` : ""}
                ${p.claimedBy 
                    ? `<span class="badge" style="background:#4c1d95; color:white;">🎯 ${p.claimedBy} ${p.claimedBy===myName ? `<button class="unclaim" onclick="unclaim('${p.id}')">✖</button>` : ""}</span>`
                    : `<button class="call" onclick="claim('${p.id}')">Call</button>`}
            </div>
        </li>`).join("");
}

async function claim(id) { await fetch("/api/claim", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, playerName:myName})}); load(); }
async function unclaim(id) { await fetch("/api/unclaim", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, playerName:myName})}); load(); }

load();
setInterval(load, 15000);
</script>
</body>
</html>
