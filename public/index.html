<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spider-Verse Warboard</title>

<style>
body { background:#121212; color:white; font-family:Arial; }
h1 { text-align:center; color:#E32832; }

.board-container { display:flex; gap:20px; }
.column { flex:1; background:#1a1a2e; padding:15px; border-radius:8px; }

li { background:#232342; margin:6px 0; padding:10px; border-radius:6px; display:flex; justify-content:space-between; }

.stat-badge { color:#feca3e; font-size:12px; margin-left:8px; }

.btn-claim { background:#E32832; color:white; border:none; padding:5px; }
.btn-unclaim { background:#1B1676; color:white; padding:5px; border:none; }

.countdown { font-family:monospace; color:#E32832; }
</style>
</head>

<body>

<h1>🕷 Spider-Verse Warboard</h1>

<div class="board-container">
    <div class="column">
        <h2>Friendly</h2>
        <ul id="friendly-list"></ul>
    </div>

    <div class="column">
        <h2>Enemy</h2>
        <ul id="enemy-list"></ul>
    </div>
</div>

<script>
let myName = localStorage.getItem("warboard_name") ||
prompt("Enter Torn name:");

localStorage.setItem("warboard_name", myName);

let friendlyData = [];
let enemyData = [];

function formatStats(n) {
    if (!n) return "Syncing...";
    if (n > 1e9) return (n/1e9).toFixed(1)+"b";
    if (n > 1e6) return (n/1e6).toFixed(1)+"m";
    if (n > 1e3) return (n/1e3).toFixed(1)+"k";
    return n;
}

function sortMembers(m) {
    return m.sort((a,b)=> {
        const score = p => {
            let s = 0;
            if (p.state === "Okay") s += 100;
            if (p.state === "Hospital") s += 50;

            let remain = (p.until || 0) - Math.floor(Date.now()/1000);
            if (remain > 0) s -= remain/60;

            if (p.onlineStatus === "Online") s += 20;
            if (p.onlineStatus === "Idle") s += 10;

            return s;
        };
        return score(b) - score(a);
    });
}

async function fetchData(){
    const res = await fetch("/api/warboard");
    const data = await res.json();

    friendlyData = sortMembers(data.friendly || []);
    enemyData = sortMembers(data.enemy || []);

    render();
}

function render(){
    document.getElementById("friendly-list").innerHTML =
    friendlyData.map(p => `
        <li>${p.name}</li>
    `).join("");

    document.getElementById("enemy-list").innerHTML =
    enemyData.map(p => `
        <li>
            ${p.name}
            ${p.estStats ? `<span class="stat-badge">Est ${formatStats(p.estStats)}</span>` : `<span class="stat-badge">Syncing...</span>`}
        </li>
    `).join("");
}

setInterval(fetchData, 15000);
fetchData();
</script>

</body>
</html>
