<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faction Warboard</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #ff4757; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .board-container { display: flex; justify-content: space-around; margin-top: 30px; gap: 20px; }
        .column { background-color: #1e1e1e; border-radius: 8px; padding: 20px; width: 48%; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .friendly-title { color: #3498db; }
        .enemy-title { color: #e74c3c; }
        
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { background-color: #2f3542; margin-bottom: 8px; padding: 12px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .status-ready { color: #2ed573; font-weight: bold; font-size: 1.1em; }
        .status-other { color: #a4b0be; font-size: 0.9em; font-style: italic; }
        .countdown { color: #ffeb3b; font-weight: bold; font-family: monospace; font-size: 1.3em; letter-spacing: 1px;}
        .timestamp { font-size: 0.85em; color: #a4b0be; text-align: center; margin-top: 30px; }

        /* Profile Links & Badges */
        .profile-link { color: #ffffff; text-decoration: none; transition: 0.2s; font-weight: 500; }
        .profile-link:hover { color: #3498db; text-decoration: underline; }
        .stat-badge { color: #f39c12; font-size: 0.85em; margin-left: 8px; font-weight: bold; background: rgba(243, 156, 18, 0.1); padding: 2px 6px; border-radius: 4px;}

        /* Activity Dots */
        .activity-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .dot-online { background-color: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
        .dot-idle { background-color: #f1c40f; }
        .dot-offline { background-color: #7f8c8d; }

        /* Buttons and Action Group */
        .btn-claim { background-color: #e67e22; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: 0.2s;}
        .btn-claim:hover { background-color: #d35400; }
        .btn-unclaim { background-color: #c0392b; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: 0.2s; margin-left: 5px; }
        .btn-unclaim:hover { background-color: #e74c3c; }
        .claimed-badge { background-color: #8e44ad; color: white; padding: 6px 10px; border-radius: 4px; font-size: 0.85em; font-weight: bold; display: inline-flex; align-items: center; gap: 5px;}
        .action-group { display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body>

    <h1>Spider-Verse Warborad</h1>
    
    <div class="board-container">
        <div class="column">
            <h2 class="friendly-title">🛡️ My Faction</h2>
            <ul id="friendly-list"><li>Loading...</li></ul>
        </div>

        <div class="column">
            <h2 class="enemy-title">⚔️ Enemy Faction</h2>
            <ul id="enemy-list"><li>Loading...</li></ul>
        </div>
    </div>

    <div class="timestamp" id="last-updated">Waiting for server...</div>

    <script>
        let myName = localStorage.getItem('warboard_name');
        if (!myName) {
            myName = prompt("Welcome to the Warboard!\nEnter your Torn name to call targets:", "");
            if (myName) localStorage.setItem('warboard_name', myName);
        }

        let friendlyData = [];
        let enemyData = [];

        function sortMembers(members) {
            return members.sort((a, b) => {
                if (a.state === 'Okay' && b.state !== 'Okay') return -1;
                if (b.state === 'Okay' && a.state !== 'Okay') return 1;
                if (a.state === 'Hospital' && b.state === 'Hospital') return a.until - b.until;
                if (a.state === 'Hospital' && b.state !== 'Hospital') return -1;
                if (b.state === 'Hospital' && a.state !== 'Hospital') return 1;
                return 0; 
            });
        }

        // Formats massive numbers into clean K/M/B readouts
        function formatStats(num) {
            if (!num) return '?';
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'b';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'm';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toString();
        }

        async function fetchWarboardData() {
            try {
                const response = await fetch('/api/warboard'); 
                const data = await response.json();
                
                friendlyData = sortMembers(data.friendly || []);
                enemyData = sortMembers(data.enemy || []);

                document.getElementById('last-updated').innerText = `Last Server Sync: ${new Date().toLocaleTimeString()}`;
                tickCountdowns(); 
            } catch (error) {
                console.error("Connection error:", error);
            }
        }

        async function callTarget(enemyId) {
            if (!myName) return alert("You need to set your name to call targets!");
            try {
                const response = await fetch('/api/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enemyId: enemyId, playerName: myName })
                });
                const result = await response.json();
                if (result.error) alert(result.error + (result.claimedBy ? ` by ${result.claimedBy}` : ''));
                fetchWarboardData();
            } catch (error) { console.error("Failed to claim:", error); }
        }

        async function unclaimTarget(enemyId) {
            try {
                await fetch('/api/unclaim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enemyId: enemyId, playerName: myName })
                });
                fetchWarboardData();
            } catch (error) { console.error("Failed to unclaim:", error); }
        }

        function generateHTML(members, now, isEnemyColumn) {
            if (members.length === 0) return '<li>No members found.</li>';
            
            return members.map(p => {
                let dotClass = 'dot-offline';
                if (p.onlineStatus === 'Online') dotClass = 'dot-online';
                if (p.onlineStatus === 'Idle') dotClass = 'dot-idle';

                // Display the estimated stats badge if we have data from TornStats
                let statsUI = isEnemyColumn && p.estStats ? `<span class="stat-badge" title="Estimated Stats">⚔️ ${formatStats(p.estStats)}</span>` : '';

                let nameLink = `<span class="activity-dot ${dotClass}" title="${p.onlineStatus}"></span><a href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank" class="profile-link">${p.name}</a> ${statsUI}`;
                
                let claimUI = '';
                if (isEnemyColumn && (p.state === 'Okay' || p.state === 'Hospital')) {
                    if (p.claimedBy) {
                        if (p.claimedBy === myName) {
                            claimUI = `<span class="claimed-badge">🎯 ${p.claimedBy}</span> <button class="btn-unclaim" title="Undo Claim" onclick="unclaimTarget('${p.id}')">✖ Cancel</button>`;
                        } else {
                            claimUI = `<span class="claimed-badge">🎯 ${p.claimedBy}</span>`;
                        }
                    } else {
                        claimUI = `<button class="btn-claim" onclick="callTarget('${p.id}')">Call Target</button>`;
                    }
                }

                if (p.state === 'Okay') {
                    return `<li>
                                <span>${nameLink}</span> 
                                <div class="action-group"><span class="status-ready">READY</span> ${claimUI}</div>
                            </li>`;
                } 
                else if (p.state === 'Hospital') {
                    let secondsLeft = p.until - now;
                    if (secondsLeft <= 0) {
                        return `<li>
                                    <span>${nameLink}</span> 
                                    <div class="action-group"><span class="status-ready">READY</span> ${claimUI}</div>
                                </li>`;
                    }
                    let h = Math.floor(secondsLeft / 3600);
                    let m = Math.floor((secondsLeft % 3600) / 60);
                    let s = secondsLeft % 60;
                    let timeText = h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m}:${s.toString().padStart(2, '0')}`;
                    
                    return `<li>
                                <span>${nameLink}</span> 
                                <div class="action-group"><span class="countdown">${timeText}</span> ${claimUI}</div>
                            </li>`;
                } 
                else {
                    return `<li style="opacity: 0.6;"><span>${nameLink}</span> <span class="status-other">${p.state}</span></li>`;
                }
            }).join('');
        }

        function tickCountdowns() {
            const now = Math.floor(Date.now() / 1000);
            document.getElementById('friendly-list').innerHTML = generateHTML(friendlyData, now, false);
            document.getElementById('enemy-list').innerHTML = generateHTML(enemyData, now, true);
        }

        window.callTarget = callTarget;
        window.unclaimTarget = unclaimTarget;

        fetchWarboardData();
        setInterval(fetchWarboardData, 15000); 
        setInterval(tickCountdowns, 1000); 
    </script>
</body>
</html>
