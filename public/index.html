<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Verse Warboard</title>
    <style>
        :root { --bg: #050505; --card: #0d1117; --item: #161b22; --red: #e11d48; --blue: #2563eb; --gold: #fbbf24; }
        body { background: var(--bg); color: #c9d1d9; font-family: 'Inter', system-ui; margin: 0; padding: 20px; }
        h1 { text-align: center; color: var(--red); text-transform: uppercase; letter-spacing: 4px; margin-bottom: 20px; font-size: 1.8rem; }
        
        #info-box { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 12px; margin: 0 auto 20px auto; max-width: 1200px; }
        #info-header { display: flex; justify-content: space-between; cursor: pointer; color: var(--gold); font-weight: bold; }
        #info-content { display: none; margin-top: 10px; font-size: 0.9em; line-height: 1.5; color: #8b949e; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .col { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #30363d; }
        h2 { color: #8b949e; border-bottom: 2px solid var(--red); padding-bottom: 10px; margin-top: 0; }
        
        ul { list-style: none; padding: 0; }
        li { 
            background: var(--item); margin-bottom: 8px; padding: 12px 16px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d;
            transition: transform 0.2s;
        }
        li:hover { transform: scale(1.01); border-color: var(--red); }
        
        .profile { font-weight: 600; color: #fff; text-decoration: none; }
        .badge { background: #21262d; padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--gold); border: 1px solid #444; cursor: pointer; }
        .manual { border: 1px solid var(--blue); color: var(--blue); }
        .timer { font-family: monospace; color: var(--red); font-weight: bold; font-size: 1.1em; }
        
        button { cursor: pointer; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .call { background: var(--red); color: white; }
        .unclaim { background: var(--blue); color: white; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; } /* Stack columns vertically on mobile */
            body { padding: 10px; }
            h1 { font-size: 1.4rem; letter-spacing: 2px; }
            li { padding: 15px; } /* Larger touch targets */
            button { padding: 10px 18px; font-size: 13px; } /* Bigger buttons for fingers */
            .profile { font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <h1>🕷 Spider-Verse Warboard</h1>

    <div id="info-box">
        <div id="info-header" onclick="toggleInfo()">WIP: Battle Stat Estimates <span id="arrow">▼</span></div>
        <div id="info-content">
            Estimated stats are calculated based on public Torn data. They are not perfect! 
            <br><strong>System:</strong> Click any yellow stat badge to input an enemy's *actual* battle stats.
        </div>
    </div>

    <div class="grid">
        <div class="col"><h2>🛡 Friendly</h2><ul id="friendly"></ul></div>
        <div class="col"><h2>⚔ Enemy</h2><ul id="enemy"></ul></div>
    </div>

<script>
let myName = localStorage.getItem("warboard_name") || prompt("Torn Name:");
if(myName) localStorage.setItem("warboard_name", myName);

function toggleInfo() {
    const content = document.getElementById("info-content");
    const arrow = document.getElementById("arrow");
    const isHidden = content.style.display === "none" || content.style.display === "";
    content.style.display = isHidden ? "block" : "none";
    arrow.innerText = isHidden ? "▲" : "▼";
}

setInterval(() => {
    document.querySelectorAll(".timer").forEach(el => {
        let left = parseInt(el.dataset.until) - Math.floor(Date.now()/1000);
        if(left > 0) {
            let h = Math.floor(left/3600), m = Math.floor((left%3600)/60), s = left%60;
            el.innerText = h > 0 ? `${h}:${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}` : `${m}:${s.toString().padStart(2,"0")}`;
        } else el.innerText = "Ready";
    });
}, 1000);

function format(n){
    if(n>1e9) return (n/1e9).toFixed(1)+"b";
    if(n>1e6) return (n/1e6).toFixed(1)+"m";
    return (n/1e3).toFixed(1)+"k";
}

function sortBoard(list, isEnemy) {
    return list.sort((a,b) => {
        if(a.state === "Hospital" && b.state === "Hospital") return a.until - b.until;
        if(a.state === "Hospital") return -1;
        if(b.state === "Hospital") return 1;
        if(isEnemy) return (b.intelScore || 0) - (a.intelScore || 0);
        return a.name.localeCompare(b.name);
    });
}

async function updateStats(id) {
    let input = prompt("Enter ACTUAL battle stats for this enemy (e.g. 5000000):");
    if(input && !isNaN(input)) {
        await fetch("/api/update-stats", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, stats:input})});
        load();
    }
}

let lastFriendly = "", lastEnemy = "";

async function load(){
    const res = await fetch("/api/warboard");
    const data = await res.json();
    
    let friendlyHTML = sortBoard(data.friendly, false).map(p => `
        <li>
            <a class="profile" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a>
            ${p.state==="Hospital" ? `<span class="timer" data-until="${p.until}"></span>` : ""}
        </li>`).join("");

    let enemyHTML = sortBoard(data.enemy, true).map(p => `
        <li>
            <div>
                <a class="profile" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a>
                ${p.estStats ? `<span class="badge ${p.isManual ? 'manual' : ''}" onclick="updateStats('${p.id}')">${format(p.estStats)}</span>` : ""}
            </div>
            <div>
                ${p.state==="Hospital" ? `<span class="timer" data-until="${p.until}"></span> ` : ""}
                ${p.claimedBy 
                    ? `<span class="badge" style="background:#4c1d95; color:white;">🎯 ${p.claimedBy} ${p.claimedBy===myName ? `<button class="unclaim" onclick="unclaim('${p.id}')">✖</button>` : ""}</span>`
                    : `<button class="call" onclick="claim('${p.id}')">Call</button>`}
            </div>
        </li>`).join("");

    if(friendlyHTML !== lastFriendly) { document.getElementById("friendly").innerHTML = friendlyHTML; lastFriendly = friendlyHTML; }
    if(enemyHTML !== lastEnemy) { document.getElementById("enemy").innerHTML = enemyHTML; lastEnemy = enemyHTML; }
}

async function claim(id) { await fetch("/api/claim", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, playerName:myName})}); load(); }
async function unclaim(id) { await fetch("/api/unclaim", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, playerName:myName})}); load(); }

load();
setInterval(load, 15000);
</script>
</body>
</html>
