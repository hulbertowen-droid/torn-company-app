<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Verse Warboard</title>
    <style>
        :root {
            --spidey-red: #E32832;
            --spidey-blue: #1B1676;
            --spidey-web: #ffffff;
            --bg-dark: #121212;
            --card-bg: #1a1a2e;
            --item-bg: #232342;
        }

        body { background-color: var(--bg-dark); color: var(--spidey-web); font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        h1 { text-align: center; color: var(--spidey-red); border-bottom: 3px solid var(--spidey-blue); padding-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px #000; }
        .board-container { display: flex; justify-content: space-around; margin-top: 30px; gap: 20px; }
        .column { background-color: var(--card-bg); border-radius: 8px; padding: 20px; width: 48%; border: 2px solid var(--spidey-blue); }
        h2 { text-align: center; margin-top: 0; padding-bottom: 10px; border-bottom: 1px solid var(--spidey-blue); }
        .friendly-title { color: #3498db; }
        .enemy-title { color: var(--spidey-red); }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { background-color: var(--item-bg); margin-bottom: 8px; padding: 12px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--spidey-red); }
        
        .profile-link { color: var(--spidey-web); text-decoration: none; font-weight: 500; }
        .profile-link:hover { color: var(--spidey-red); text-decoration: underline; }
        
        .stat-badge { color: #feca3e; font-size: 0.8em; margin-left: 8px; font-weight: bold; background: rgba(254, 202, 62, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid #feca3e;}
        .countdown { color: var(--spidey-red); font-weight: bold; font-family: monospace; font-size: 1.2em; }
        
        .claim-btn { background-color: var(--spidey-red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .claim-btn:hover { background-color: #b71c1c; }
        .unclaim-btn { background-color: var(--spidey-blue); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🕷️ Spider-Verse Warboard 🕷️</h1>
    
    <div class="board-container">
        <div class="column">
            <h2 class="friendly-title">🛡️ Friendly</h2>
            <ul id="friendly"></ul>
        </div>
        <div class="column">
            <h2 class="enemy-title">⚔️ Enemy</h2>
            <ul id="enemy"></ul>
        </div>
    </div>

<script>
let myName = localStorage.getItem("warboard_name");
if (!myName) {
    myName = prompt("Enter Torn name:");
    if(myName) localStorage.setItem("warboard_name", myName);
}

function format(n){
    if(!n) return "Syncing...";
    if(n>1e9) return (n/1e9).toFixed(1)+"b";
    if(n>1e6) return (n/1e6).toFixed(1)+"m";
    if(n>1e3) return (n/1e3).toFixed(1)+"k";
    return n;
}

function sort(m){
    return m.sort((a,b)=> (b.intelScore||0)-(a.intelScore||0));
}

async function callTarget(enemyId) {
    if (!myName) return alert("Set name first!");
    await fetch("/api/claim", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({enemyId, playerName: myName}) });
    load();
}

async function unclaimTarget(enemyId) {
    await fetch("/api/unclaim", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({enemyId, playerName: myName}) });
    load();
}

async function load(){
    const res = await fetch("/api/warboard");
    const data = await res.json();
    render(data);
}

function render(data){
    const now = Math.floor(Date.now()/1000);

    document.getElementById("friendly").innerHTML = data.friendly.map(p=>`
        <li>
            <a class="profile-link" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a>
        </li>
    `).join("");

    document.getElementById("enemy").innerHTML = sort(data.enemy).map(p=>{
        let time = "";
        if(p.state==="Hospital" && p.until){
            let left = p.until-now;
            if(left>0){
                let m=Math.floor(left/60), s=left%60;
                time = `<span class="countdown">${m}:${s.toString().padStart(2,"0")}</span>`;
            }
        }

        let claimUI = p.claimedBy 
            ? `<span class="stat-badge">🎯 ${p.claimedBy} ${p.claimedBy === myName ? `<button class="unclaim-btn" onclick="unclaimTarget('${p.id}')">✖</button>` : ""}</span>`
            : `<button class="claim-btn" onclick="callTarget('${p.id}')">Call</button>`;

        return `
        <li>
            <div>
                <a class="profile-link" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a>
                ${p.estStats ? `<span class="stat-badge">${format(p.estStats)}</span>` : ""}
                ${p.intelScore ? `<span class="stat-badge" style="color:#00ffcc">I:${p.intelScore}</span>` : ""}
            </div>
            <div>
                ${time}
                ${claimUI}
            </div>
        </li>`;
    }).join("");
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
