<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Verse Warboard</title>
    <style>
        :root { --bg: #0a0c10; --card: #161b22; --item: #21262d; --red: #ff3e3e; --blue: #58a6ff; --gold: #e3b341; }
        body { background: var(--bg); color: #e6edf3; font-family: 'Segoe UI', system-ui; margin: 0; padding: 20px; }
        h1 { text-align: center; color: var(--red); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; }
        
        /* Glassmorphism Header */
        #info-box { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; padding: 15px; border-radius: 12px; margin: 0 auto 20px auto; max-width: 1200px; backdrop-filter: blur(10px); }
        #info-header { display: flex; justify-content: space-between; cursor: pointer; color: var(--gold); font-weight: bold; }
        #info-content { display: none; margin-top: 10px; font-size: 0.9em; color: #8b949e; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .col { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #30363d; }
        h2 { color: #8b949e; border-bottom: 2px solid var(--red); padding-bottom: 10px; margin-top: 0; }
        
        ul { list-style: none; padding: 0; }
        li { background: var(--item); margin-bottom: 8px; padding: 10px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d; transition: 0.2s; }
        li:hover { border-color: #8b949e; }
        
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-online { background-color: #22c55e; } .dot-idle { background-color: #eab308; } .dot-offline { background-color: #475569; }
        
        .profile { font-weight: 600; color: #fff; text-decoration: none; }
        .badge { background: #0d1117; padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--gold); border: 1px solid #30363d; cursor: pointer; }
        .hits { color: #94a3b8; border-color: #30363d; }
        .timer-hosp { font-family: monospace; color: var(--red); font-weight: bold; }
        .timer-status { font-size: 0.85em; color: #58a6ff; font-weight: 500; }
        
        button { cursor: pointer; border: none; padding: 5px 12px; border-radius: 4px; font-weight: bold; font-size: 10px; background: var(--red); color: white; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>🕷 Spider-Verse Warboard</h1>
    <div id="info-box">
        <div id="info-header" onclick="toggleInfo()">WIP: Battle Stat Estimates & War Hits <span id="arrow">▼</span></div>
        <div id="info-content">Okay at top, Flying at bottom. Estimates refresh every 20m. "Hits" = last 24h. Click stat badge to override.</div>
    </div>
    <div class="grid">
        <div class="col"><h2>🛡 Friendly</h2><ul id="friendly"></ul></div>
        <div class="col"><h2>⚔ Enemy</h2><ul id="enemy"></ul></div>
    </div>
<script>
let myName = localStorage.getItem("warboard_name") || prompt("Torn Name:");
if(myName) localStorage.setItem("warboard_name", myName);
function toggleInfo() { const c = document.getElementById("info-content"); c.style.display = c.style.display === "none" ? "block" : "none"; document.getElementById("arrow").innerText = c.style.display === "none" ? "▼" : "▲"; }

// Priority Sorting: Okay(3) > Hospital(2) > Traveling(1)
function getPriority(p) {
    if (p.state === "Okay") return 3;
    if (p.state === "Hospital") return 2;
    if (p.state === "Traveling") return 1;
    return 0;
}

function sortBoard(list, isEnemy) {
    return list.sort((a,b) => {
        let pA = getPriority(a), pB = getPriority(b);
        if (pA !== pB) return pB - pA;
        if (a.state === "Hospital" && b.state === "Hospital") return a.until - b.until;
        if (isEnemy) return (b.intelScore || 0) - (a.intelScore || 0);
        return a.name.localeCompare(b.name);
    });
}

setInterval(() => {
    document.querySelectorAll(".timer-hosp").forEach(el => {
        let left = parseInt(el.dataset.until) - Math.floor(Date.now()/1000);
        if(left > 0) {
            let h = Math.floor(left/3600), m = Math.floor((left%3600)/60), s = left%60;
            el.innerText = h > 0 ? `${h}:${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}` : `${m}:${s.toString().padStart(2,"0")}`;
        } else el.innerText = "Ready";
    });
}, 1000);

function format(n){ if(n>1e9) return (n/1e9).toFixed(1)+"b"; if(n>1e6) return (n/1e6).toFixed(1)+"m"; return (n/1e3).toFixed(1)+"k"; }
async function updateStats(id) {
    let input = prompt("Enter ACTUAL battle stats:");
    if(input && !isNaN(input)) { await fetch("/api/update-stats", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, stats:input})}); load(); }
}

let lastFriendly = "", lastEnemy = "";
async function load(){
    const res = await fetch("/api/warboard");
    const data = await res.json();
    
    let friendlyHTML = sortBoard(data.friendly, false).map(p => `<li><div><span class="dot dot-${p.onlineStatus.toLowerCase()}"></span><a class="profile" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a> ${p.estStats ? `<span class="badge">${format(p.estStats)}</span>` : ""} ${p.hits > 0 ? `<span class="badge hits">${p.hits}H</span>` : ""}</div> <span class="timer-status">${p.state === "Okay" ? "Okay" : (p.state !== "Hospital" ? p.statusDescription : "")}</span> ${p.state==="Hospital" ? `<span class="timer-hosp" data-until="${p.until}"></span>` : ""}</li>`).join("");
    
    let enemyHTML = sortBoard(data.enemy, true).map(p => `<li><div><span class="dot dot-${p.onlineStatus.toLowerCase()}"></span><a class="profile" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank">${p.name}</a> ${p.estStats ? `<span class="badge" onclick="updateStats('${p.id}')">${format(p.estStats)}</span>` : ""} ${p.hits > 0 ? `<span class="badge hits">${p.hits}H</span>` : ""}</div><div><span class="timer-status">${p.state === "Okay" ? "Okay" : (p.state !== "Hospital" ? p.statusDescription : "")}</span> ${p.state==="Hospital" ? `<span class="timer-hosp" data-until="${p.until}"></span> ` : ""}<button class="call" onclick="claim('${p.id}')">Call</button></div></li>`).join("");

    if(friendlyHTML !== lastFriendly) { document.getElementById("friendly").innerHTML = friendlyHTML; lastFriendly = friendlyHTML; }
    if(enemyHTML !== lastEnemy) { document.getElementById("enemy").innerHTML = enemyHTML; lastEnemy = enemyHTML; }
}

async function claim(id) { await fetch("/api/claim", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({enemyId:id, playerName:myName})}); load(); }
load(); setInterval(load, 15000);
</script>
</body>
</html>
