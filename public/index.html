<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider-Verse Warboard</title>

<style>
:root {
    --spidey-red:#E32832;
    --spidey-blue:#1B1676;
    --bg:#121212;
    --card:#1a1a2e;
    --item:#232342;
}

body { background:var(--bg); color:white; font-family:Segoe UI; margin:0; padding:20px; }
h1 { text-align:center; color:var(--spidey-red); }

.board-container { display:flex; gap:20px; }
.column { flex:1; background:var(--card); padding:15px; border-radius:8px; }

li {
    background:var(--item);
    margin:6px 0;
    padding:10px;
    border-radius:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profile-link {
    color:white;
    text-decoration:none;
}
.profile-link:hover {
    color:var(--spidey-red);
}

.stat-badge {
    color:#feca3e;
    font-size:12px;
    margin-left:8px;
}

.countdown {
    font-family:monospace;
    color:var(--spidey-red);
}

.claim-btn {
    background:var(--spidey-red);
    border:none;
    color:white;
    padding:5px;
}
.unclaim-btn {
    background:var(--spidey-blue);
    border:none;
    color:white;
    padding:5px;
}
</style>
</head>

<body>

<h1>🕷 Spider-Verse Warboard</h1>

<div class="board-container">
    <div class="column">
        <h2>Friendly</h2>
        <ul id="friendly"></ul>
    </div>

    <div class="column">
        <h2>Enemy</h2>
        <ul id="enemy"></ul>
    </div>
</div>

<script>
let myName = localStorage.getItem("warboard_name") ||
prompt("Enter Torn name:");
localStorage.setItem("warboard_name", myName);

function format(n){
    if(!n) return "Syncing...";
    if(n>1e9) return (n/1e9).toFixed(1)+"b";
    if(n>1e6) return (n/1e6).toFixed(1)+"m";
    if(n>1e3) return (n/1e3).toFixed(1)+"k";
    return n;
}

function sort(m){
    return m.sort((a,b)=> (b.intelScore||0)-(a.intelScore||0));
}

async function load(){
    const res = await fetch("/api/warboard");
    const data = await res.json();

    render(data);
}

function render(data){
    const now = Math.floor(Date.now()/1000);

    document.getElementById("friendly").innerHTML =
    data.friendly.map(p=>`
        <li>
            <a class="profile-link"
               href="https://www.torn.com/profiles.php?XID=${p.id}"
               target="_blank"
               title="View profile">${p.name}</a>
        </li>
    `).join("");

    document.getElementById("enemy").innerHTML =
    sort(data.enemy).map(p=>{

        let time = "";
        if(p.state==="Hospital" && p.until){
            let left = p.until-now;
            if(left>0){
                let m=Math.floor(left/60), s=left%60;
                time = `<span class="countdown">${m}:${s.toString().padStart(2,"0")}</span>`;
            }
        }

        return `
        <li>
            <div>
                <a class="profile-link"
                   href="https://www.torn.com/profiles.php?XID=${p.id}"
                   target="_blank"
                   title="Open Torn profile">${p.name}</a>

                ${p.estStats ? `<span class="stat-badge">${format(p.estStats)}</span>` : ""}

                ${p.intelScore ? `<span class="stat-badge" style="color:#00ffcc">I:${p.intelScore}</span>` : ""}
            </div>

            <div>
                ${time}
                ${p.claimedBy ? `<span class="stat-badge">🎯 ${p.claimedBy}</span>` : ""}
            </div>
        </li>
        `;
    }).join("");
}

load();
setInterval(load, 15000);
</script>

</body>
</html>
