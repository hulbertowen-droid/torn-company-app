<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Calculator | Spider-Verse</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- The Smart Nav Bar -->
    <div class="top-nav">
        <a href="/" class="nav-link">📡 Live Warboard</a>
        <a href="/chain.html" class="nav-link">🔗 Chain Watcher</a>
        <a href="/payout.html" class="nav-link">💰 Payout Calculator</a>
        <a href="/dashboard.html" class="nav-link">🛡️ Alliance Dashboard</a>
        <a href="/recruitment.html" class="nav-link">🎯 Recruitment</a>
        <a onclick="openSettings()" class="nav-link" style="cursor:pointer; border-left: 1px solid #2f3542; border-radius:0;">⚙️ Settings</a>
    </div>

    <h1>Payout Calculator</h1>

    <div class="container" style="display: flex; flex-direction: column; max-width: 1200px;">
        <div class="dash-card" style="text-align: center;">
            <h2 style="color: var(--gold); margin-top: 0;">Ranked War Report</h2>
            <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
                <input type="text" id="report-id" placeholder="Enter War Report ID (e.g. 12345)" style="padding: 10px; border-radius: 6px; border: 1px solid #2f3542; background: #0b0d13; color: white; width: 300px;">
                <button class="btn-action btn-attack" onclick="calculatePayouts()" style="animation: none;">Calculate Payouts</button>
            </div>
            <div id="payout-error" style="color: var(--red); font-weight: bold;"></div>
        </div>

        <div class="dash-card">
            <h2 style="color: var(--gold); border-bottom: 1px solid #2f3542; padding-bottom: 10px; margin-top: 0;">War Rewards</h2>
            <div id="rewards-summary" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
                <div style="color: var(--text-dim);">Waiting for report data...</div>
            </div>

            <h2 style="color: var(--gold); border-bottom: 1px solid #2f3542; padding-bottom: 10px;">Member Performance</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Score</th>
                            <th>Attacks</th>
                            <th>Assists</th>
                            <th>Clears (Outside)</th>
                        </tr>
                    </thead>
                    <tbody id="payout-list">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-dim);">No data loaded.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // --- SMART NAV HIGHLIGHTER ---
    document.addEventListener("DOMContentLoaded", function() {
        let currentUrl = window.location.pathname;
        if (currentUrl === "/index.html") currentUrl = "/"; 
        let links = document.querySelectorAll(".top-nav .nav-link");
        links.forEach(link => {
            link.classList.remove("active"); 
            if (link.getAttribute("href") === currentUrl) link.classList.add("active"); 
        });
    });

    const myKey = localStorage.getItem("warboard_apikey");

    async function calculatePayouts() {
        if (!myKey) { document.getElementById("payout-error").innerText = "Please set your API key on the Live Warboard settings first."; return; }
        
        const reportId = document.getElementById("report-id").value.trim();
        if (!reportId) { document.getElementById("payout-error").innerText = "Please enter a War Report ID."; return; }

        document.getElementById("payout-error").innerText = "Crunching numbers... This may take up to 10 seconds to scrape logs.";
        document.getElementById("payout-list").innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--blue); font-weight: bold;">Loading Data...</td></tr>`;

        try {
            const res = await fetch(`/api/past-war?apiKey=${myKey}&reportId=${reportId}`);
            const data = await res.json();

            if (data.error) {
                document.getElementById("payout-error").innerText = "API Error: " + data.error;
                document.getElementById("payout-list").innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--red);">Error loading data.</td></tr>`;
                return;
            }

            document.getElementById("payout-error").innerText = "";

            // Render Rewards
            let rewardsHtml = `
                <div class="watch-card online" style="text-align: center;">
                    <div style="font-size: 0.9em; color: var(--text-dim); text-transform: uppercase;">Total Cache Value</div>
                    <div style="font-size: 1.5em; font-weight: bold; color: var(--green);">$${data.rewards.totalCacheValue.toLocaleString()}</div>
                </div>
                <div class="watch-card flying" style="text-align: center;">
                    <div style="font-size: 0.9em; color: var(--text-dim); text-transform: uppercase;">Respect Earned</div>
                    <div style="font-size: 1.5em; font-weight: bold; color: var(--blue);">${data.rewards.respect.toLocaleString()}</div>
                </div>
                <div class="watch-card" style="text-align: center;">
                    <div style="font-size: 0.9em; color: var(--text-dim); text-transform: uppercase;">Points Earned</div>
                    <div style="font-size: 1.5em; font-weight: bold; color: var(--gold);">${data.rewards.points.toLocaleString()}</div>
                </div>
            `;
            document.getElementById("rewards-summary").innerHTML = rewardsHtml;

            // Render Members
            let membersHtml = "";
            if (data.members && data.members.length > 0) {
                data.members.forEach(m => {
                    membersHtml += `
                        <tr>
                            <td><a href="https://www.torn.com/profiles.php?XID=${m.id}" target="_blank" style="color:var(--text-main); font-weight:bold; text-decoration:none;">${m.name}</a></td>
                            <td style="color:var(--gold); font-weight:bold;">${m.score}</td>
                            <td>${m.attacks}</td>
                            <td style="color:var(--blue);">${m.assists}</td>
                            <td style="color:var(--green);">${m.clears}</td>
                        </tr>
                    `;
                });
            } else {
                membersHtml = `<tr><td colspan="5" style="text-align: center; color: var(--text-dim);">No members found in this report.</td></tr>`;
            }
            document.getElementById("payout-list").innerHTML = membersHtml;

        } catch (e) {
            document.getElementById("payout-error").innerText = "Failed to calculate. Server error.";
            console.error(e);
        }
    }
</script>
</body>
</html>
