<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Calculator | Spider-Verse</title>
    <style>
        :root { 
            --bg: #090a0f; --card: #11141d; --item: #1b202e; 
            --red: #ff4757; --blue: #58a6ff; --gold: #ffa502;
            --text-main: #f1f2f6; --text-dim: #a1aab5; --green: #2ed573;
        }
        body { background: var(--bg); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; }
        
        .top-nav { display: flex; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto 20px auto; background: var(--card); padding: 12px; border-radius: 10px; border: 1px solid #2f3542; }
        .nav-link { color: var(--text-dim); text-decoration: none; font-weight: bold; padding: 6px 12px; border-radius: 6px; transition: 0.2s; text-transform: uppercase; font-size: 0.9em; letter-spacing: 1px; cursor: pointer; }
        .nav-link:hover { background: #2f3542; color: white; }
        .nav-link.active { color: white; background: rgba(88, 166, 255, 0.15); border: 1px solid var(--blue); }

        h1 { text-align: center; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; font-weight: 900; margin-bottom: 25px; }

        .container { max-width: 1000px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #2f3542; }
        
        .input-group { display: flex; gap: 15px; margin-bottom: 30px; align-items: center; justify-content: center; }
        .input-group select { padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #0b0d13; color: white; font-size: 1em; width: 350px; cursor: pointer; }
        .input-group button { background: var(--gold); color: #000; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.2s; text-transform: uppercase; }
        .input-group button:hover { background: #ffbe33; }

        .summary-box { background: rgba(255, 165, 2, 0.05); border: 1px solid var(--gold); padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: center; display: none; }
        .summary-box h3 { margin: 0 0 10px 0; color: var(--gold); }
        .big-money { font-size: 2em; font-weight: bold; color: var(--green); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; display: none; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2f3542; }
        th { color: var(--text-dim); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .score-val { color: var(--blue); font-weight: bold; }
        .payout-val { color: var(--green); font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/" class="nav-link">📡 Live Warboard</a>
        <a href="/payout.html" class="nav-link active">💰 Payout Calculator</a>
        <a href="/dashboard.html" class="nav-link">🛡️ Alliance Dashboard</a>
    </div>

    <h1>War Payout Calculator</h1>

    <div class="container">
        <div class="input-group">
            <select id="report-id">
                <option value="">Loading recent wars...</option>
            </select>
            <button onclick="calculatePayout()">Calculate Split</button>
        </div>

        <div id="error-msg" style="color: var(--red); text-align: center; margin-bottom: 20px;"></div>

        <div id="summary-box" class="summary-box">
            <h3>Total Est. Cache Value</h3>
            <div class="big-money" id="total-pool">$0</div>
            <p style="color: var(--text-dim); font-size: 0.9em; margin-top: 10px;">Payouts below are calculated proportionally based on each member's total war score.</p>
        </div>

        <table id="payout-table">
            <thead>
                <tr>
                    <th>Member</th>
                    <th>Attacks</th>
                    <th>Score</th>
                    <th>Score %</th>
                    <th>Est. Payout Cut</th>
                </tr>
            </thead>
            <tbody id="payout-list"></tbody>
        </table>
    </div>

<script>
    const myKey = localStorage.getItem("warboard_apikey");

    // Auto-fetch the war list on page load
    async function fetchWarList() {
        if (!myKey) {
            document.getElementById("error-msg").innerText = "Please set your API key on the Live Warboard settings first.";
            return;
        }
        try {
            const res = await fetch(`/api/war-list?apiKey=${myKey}`);
            const data = await res.json();
            const select = document.getElementById("report-id");
            
            if (data.error) {
                select.innerHTML = `<option value="">Error: ${data.error}</option>`;
                return;
            }

            if (data.wars && data.wars.length > 0) {
                let html = "";
                data.wars.forEach(w => {
                    let d = new Date(w.start * 1000).toLocaleDateString();
                    html += `<option value="${w.id}">War vs ${w.enemy} (${d})</option>`;
                });
                select.innerHTML = html;
            } else {
                select.innerHTML = `<option value="">No recent ranked wars found</option>`;
            }
        } catch (e) {
            document.getElementById("report-id").innerHTML = `<option value="">Failed to load wars</option>`;
        }
    }
    
    fetchWarList();

    async function calculatePayout() {
        const reportId = document.getElementById("report-id").value;
        const errorDiv = document.getElementById("error-msg");
        const summaryBox = document.getElementById("summary-box");
        const table = document.getElementById("payout-table");
        const list = document.getElementById("payout-list");

        errorDiv.innerText = "";
        if (!reportId) {
            errorDiv.innerText = "Please select a valid Ranked War from the dropdown.";
            return;
        }

        list.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-dim);">Fetching report data from Torn API...</td></tr>`;
        summaryBox.style.display = "none";
        table.style.display = "table";

        try {
            const res = await fetch(`/api/past-war?apiKey=${myKey}&reportId=${reportId}`);
            const data = await res.json();

            if (data.error) throw new Error(data.error);

            const totalValue = data.rewards.totalCacheValue || 0;
            document.getElementById("total-pool").innerText = "$" + totalValue.toLocaleString();
            
            let totalFactionScore = 0;
            data.members.forEach(m => totalFactionScore += m.score);

            let html = "";
            data.members.forEach(m => {
                let percent = totalFactionScore > 0 ? (m.score / totalFactionScore) : 0;
                let payoutCut = totalValue * percent;

                html += `<tr>
                    <td><a href="https://www.torn.com/profiles.php?XID=${m.id}" target="_blank" style="color:var(--text-main); text-decoration:none; font-weight:bold;">${m.name} [${m.id}]</a></td>
                    <td>${m.attacks}</td>
                    <td class="score-val">${m.score}</td>
                    <td style="color:var(--text-dim);">${(percent * 100).toFixed(2)}%</td>
                    <td class="payout-val">$${Math.floor(payoutCut).toLocaleString()}</td>
                </tr>`;
            });

            list.innerHTML = html;
            summaryBox.style.display = "block";

        } catch (e) {
            list.innerHTML = "";
            table.style.display = "none";
            errorDiv.innerText = e.message || "Failed to load payout data.";
        }
    }
</script>
</body>
</html>
