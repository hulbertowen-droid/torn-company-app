<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Calculator | Spider-Verse</title>
    <style>
        :root { 
            --bg: #090a0f; --card: #11141d; --item: #1b202e; 
            --red: #ff4757; --blue: #58a6ff; --gold: #ffa502;
            --text-main: #f1f2f6; --text-dim: #a1aab5; --green: #2ed573;
        }
        body { background: var(--bg); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #2f3542; }
        .setup-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; background: #0b0d13; padding: 20px; border-radius: 12px; border: 1px solid #2f3542; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.85em; color: var(--text-dim); margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        .input-group input, .input-group select { padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: var(--card); color: white; font-size: 1em; }
        .btn-fetch { grid-column: 1 / -1; background: var(--blue); color: white; padding: 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        
        .payout-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95em; }
        .payout-table th, .payout-table td { padding: 14px; text-align: left; border-bottom: 1px solid #2f3542; }
        .money-text { color: var(--green); font-weight: bold; font-family: 'Courier New', Courier, monospace; }
        #rewards-breakdown { display: none; background: rgba(46, 213, 115, 0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(46, 213, 115, 0.3); margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ranked War Payouts</h1>
        <div class="setup-box">
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>Ranked War Report ID</label>
                <input type="text" id="inp-report" placeholder="e.g. 12345">
            </div>
            <button class="btn-fetch" id="btn-fetch" onclick="fetchWarData()">Fetch Official War Report</button>
        </div>

        <div id="rewards-breakdown">
            <h3 id="report-title">🎁 Automated War Rewards</h3>
            <ul id="rewards-list"></ul>
        </div>

        <div class="setup-box">
            <div class="input-group"><label>Trader Rate (%)</label><input type="number" id="inp-trader" value="95" oninput="calculatePayouts()"></div>
            <div class="input-group"><label>Vault Cut (%)</label><input type="number" id="inp-cut" value="20" oninput="calculatePayouts()"></div>
            <div class="input-group"><label>Std Weight</label><input type="number" id="inp-w-std" step="0.1" value="1.0" oninput="calculatePayouts()"></div>
            <div class="input-group"><label>Assist Weight</label><input type="number" id="inp-w-ast" step="0.1" value="0.5" oninput="calculatePayouts()"></div>
            <div class="input-group"><label>Retail Weight</label><input type="number" id="inp-w-ret" step="0.1" value="1.5" oninput="calculatePayouts()"></div>
        </div>

        <table class="payout-table" id="payout-table" style="display: table;">
            <thead>
                <tr>
                    <th>Member</th><th>Hits</th><th>Assists</th><th>Retaliations</th><th>Respect</th><th>Share %</th><th>Payout</th>
                </tr>
            </thead>
            <tbody id="payout-body"></tbody>
        </table>
    </div>

<script>
let currentWarData = [];
window.cacheMarketValue = 0;

async function fetchWarData() {
    const reportId = document.getElementById("inp-report").value.trim();
    const myKey = localStorage.getItem("warboard_apikey");
    const res = await fetch(`/api/past-war?apiKey=${myKey}&reportId=${reportId}`);
    const data = await res.json();
    
    currentWarData = data.members;
    window.cacheMarketValue = data.rewards.totalCacheValue;
    
    // UI Updates
    document.getElementById("rewards-breakdown").style.display = "block";
    let rewardsHTML = "";
    data.rewards.caches.forEach(c => {
        rewardsHTML += `<li>${c.quantity}x <strong>${c.name}</strong> = ${c.totalValue.toLocaleString()}</li>`;
    });
    document.getElementById("rewards-list").innerHTML = rewardsHTML;
    calculatePayouts();
}

function calculatePayouts() {
    let traderRate = parseFloat(document.getElementById("inp-trader").value) / 100;
    let vaultCut = parseFloat(document.getElementById("inp-cut").value) / 100;
    let totalPool = (window.cacheMarketValue * traderRate) * (1 - vaultCut);
    
    let wStd = parseFloat(document.getElementById("inp-w-std").value);
    let wAst = parseFloat(document.getElementById("inp-w-ast").value);
    let wRet = parseFloat(document.getElementById("inp-w-ret").value);

    let sumTotal = currentWarData.reduce((acc, p) => acc + (p.attacks * wStd + p.assists * wAst + p.retaliations * wRet), 0);
    
    let html = "";
    currentWarData.forEach(p => {
        let weighted = (p.attacks * wStd + p.assists * wAst + p.retaliations * wRet);
        let share = weighted / sumTotal;
        html += `<tr>
            <td>${p.name}</td><td>${p.attacks}</td><td>${p.assists}</td><td>${p.retaliations}</td>
            <td>${p.score}</td><td>${(share*100).toFixed(2)}%</td>
            <td class="money-text">$${(totalPool * share).toLocaleString()}</td>
        </tr>`;
    });
    document.getElementById("payout-body").innerHTML = html;
}
</script>
</body>
</html>
