<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Manager | Owen's Faction Tools</title>
    <style>
        :root { 
            --bg: #090a0f; --card: #11141d; --item: #1b202e; 
            --red: #ff4757; --blue: #58a6ff; --gold: #ffa502;
            --text-main: #f1f2f6; --text-dim: #a1aab5; --green: #2ed573;
        }
        
        body { display: flex; background: var(--bg); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0d13; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #57606f; }

        .sidebar { width: 260px; background: var(--card); border-right: 1px solid #2f3542; display: flex; flex-direction: column; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0; z-index: 100; box-shadow: 2px 0 15px rgba(0,0,0,0.5); }
        .sidebar.collapsed { width: 75px; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2f3542; }
        .sidebar-logo { color: var(--red); font-weight: 900; font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px; white-space: nowrap; transition: opacity 0.2s; }
        .sidebar.collapsed .sidebar-logo { opacity: 0; width: 0; display: none; }
        .toggle-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.5em; display: flex; justify-content: center; align-items: center; width: 35px; height: 35px; border-radius: 6px; transition: 0.2s; }
        .toggle-btn:hover { color: white; background: #2f3542; }
        .nav-items { display: flex; flex-direction: column; gap: 8px; padding: 20px 10px; }
        .nav-link { display: flex; align-items: center; gap: 15px; color: var(--text-dim); text-decoration: none; font-weight: bold; padding: 12px 15px; border-radius: 8px; transition: 0.2s; white-space: nowrap; overflow: hidden; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .nav-link:hover { background: #2f3542; color: white; }
        .nav-link.active { background: rgba(255, 71, 87, 0.1); border-left: 4px solid var(--red); color: white; border-radius: 0 8px 8px 0; }
        .nav-text { transition: opacity 0.2s; }
        .sidebar.collapsed .nav-text { opacity: 0; width: 0; display: none; }
        
        .main-content { flex-grow: 1; overflow-y: auto; padding: 30px; height: 100vh; box-sizing: border-box; position: relative; }

        #refresh-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #0b0d13; z-index: 50; }
        #refresh-bar { height: 100%; width: 0%; background: var(--blue); box-shadow: 0 0 8px var(--blue); transition: width 0.1s linear; }

        h1 { text-align: center; color: var(--blue); text-transform: uppercase; letter-spacing: 3px; font-weight: 900; margin-bottom: 25px; text-shadow: 0 4px 15px rgba(88,166,255,0.2); }

        .container { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 25px; }

        .oc-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #2f3542; box-shadow: 0 8px 20px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .oc-card h2 { margin-top:0; color:var(--gold); border-bottom: 1px solid #2f3542; padding-bottom: 10px; font-size:1.2em; text-transform:uppercase; display: flex; justify-content: space-between; align-items: center; }
        
        .participant-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .p-card { background: #0b0d13; border: 1px solid #2f3542; padding: 12px 18px; border-radius: 8px; display: flex; flex-direction: column; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .p-card.ready { border-color: var(--green); background: rgba(46, 213, 115, 0.05); }
        .p-card.issue { border-color: var(--red); background: rgba(255, 71, 87, 0.05); }
        .p-name { font-weight: bold; font-size: 1.1em; margin-bottom: 4px; }
        .p-name a { color: var(--text-main); text-decoration: none; }
        .p-name a:hover { text-decoration: underline; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--card); padding: 30px; border-radius: 16px; border: 1px solid #2f3542; width: 400px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .modal-content h2 { margin: 0 0 10px 0; color: var(--gold); border-bottom: 1px solid #2f3542; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .modal-content label { font-size: 0.85em; color: var(--text-dim); font-weight: bold; text-transform: uppercase; }
        .modal-content input { padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #0b0d13; color: white; font-size: 1em; width: 100%; box-sizing: border-box; transition: 0.2s; }
        .modal-content input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 8px rgba(88,166,255,0.2); }
        .modal-content button.btn-save { background: var(--blue); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1em; margin-top: 10px; transition: 0.2s; text-transform: uppercase; }
        .modal-content button.btn-save:hover { background: #79c0ff; box-shadow: 0 0 12px rgba(88,166,255,0.4); }
        .close-btn { position: absolute; right: 20px; top: 20px; color: var(--text-dim); cursor: pointer; font-size: 1.5em; line-height: 1; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body>
    <nav class="sidebar" id="app-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">Owen's Faction Tools</div>
            <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
        </div>
        <div class="nav-items">
            <a href="/" class="nav-link">📡 <span class="nav-text">Live Warboard</span></a>
            <a href="/chain.html" class="nav-link">🔗 <span class="nav-text">Chain Watcher</span></a>
            <a href="/payout.html" class="nav-link">💰 <span class="nav-text">Payouts</span></a>
            <a href="/dashboard.html" class="nav-link">🛡️ <span class="nav-text">Dashboard</span></a>
            <a href="/recruitment.html" class="nav-link">🎯 <span class="nav-text">Recruitment</span></a>
            <a href="/bazaar.html" class="nav-link">🛒 <span class="nav-text">Bazaar Watcher</span></a>
            <a href="/discord.html" class="nav-link">📢 <span class="nav-text">Discord Alerts</span></a>
            <a href="/admin.html" class="nav-link">👑 <span class="nav-text">Admin Panel</span></a>
            <a href="/oc.html" class="nav-link active">💼 <span class="nav-text">OC Manager</span></a>
            <a onclick="openSettings()" class="nav-link" style="margin-top: 15px; border-top: 1px solid #2f3542; border-radius: 0; padding-top: 15px; cursor: pointer;">
                ⚙️ <span class="nav-text">Settings</span>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div id="refresh-bar-container"><div id="refresh-bar"></div></div>
        
        <h1>Organized Crimes Manager</h1>

        <div class="container" id="oc-container">
            <div style="color:var(--text-dim); padding:20px; text-align: center; font-style: italic;">Loading Organized Crimes...</div>
        </div>

        <div id="settings-modal" class="modal-overlay">
            <div class="modal-content" style="position: relative;">
                <div class="close-btn" onclick="closeSettings()">&times;</div>
                <h2>OC Settings</h2>
                <div>
                    <label>Torn API Key (Faction Perms)</label>
                    <input type="password" id="api-key" placeholder="Paste your Torn API Key here">
                </div>
                <div>
                    <label>Discord Webhook (Missing Items Alert)</label>
                    <input type="text" id="discord-webhook" placeholder="Webhook URL">
                </div>
                <div>
                    <label>Discord Role ID to @ (Optional)</label>
                    <input type="text" id="discord-role" placeholder="e.g. 123456789012345678">
                </div>
                <button class="btn-save" onclick="saveSettings()">Save & Connect</button>
            </div>
        </div>
    </main>

<script>
let myKey = localStorage.getItem("warboard_apikey") || "";
let ocWebhook = localStorage.getItem("oc_webhook") || "";
let ocRole = localStorage.getItem("oc_role") || "";

let fetchTimer = null;
let progressTimer = null;
const REFRESH_MS = 300000; // 5 minutes

document.getElementById("api-key").value = myKey;
document.getElementById("discord-webhook").value = ocWebhook;
document.getElementById("discord-role").value = ocRole;

function toggleSidebar() {
    const sidebar = document.getElementById('app-sidebar');
    sidebar.classList.toggle('collapsed');
}

function openSettings() { document.getElementById("settings-modal").style.display = "flex"; }
function closeSettings() { document.getElementById("settings-modal").style.display = "none"; }

function saveSettings() {
    myKey = document.getElementById("api-key").value.trim();
    ocWebhook = document.getElementById("discord-webhook").value.trim();
    ocRole = document.getElementById("discord-role").value.trim();
    
    localStorage.setItem("warboard_apikey", myKey);
    localStorage.setItem("oc_webhook", ocWebhook);
    localStorage.setItem("oc_role", ocRole);

    fetch('/api/save-oc-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ webhookUrl: ocWebhook, roleId: ocRole })
    }).catch(console.error);

    closeSettings();
    startPolling();
}

function startRefreshProgressBar(refreshMs) {
    if (progressTimer) clearInterval(progressTimer);
    const bar = document.getElementById("refresh-bar");
    let startTime = Date.now();
    
    bar.style.transition = "none";
    bar.style.width = "0%";
    setTimeout(() => { bar.style.transition = "width 0.1s linear"; }, 50);

    progressTimer = setInterval(() => {
        let elapsed = Date.now() - startTime;
        let percent = (elapsed / refreshMs) * 100;
        if (percent > 100) percent = 100;
        bar.style.width = `${percent}%`;
    }, 100);
}

function startPolling() {
    if (fetchTimer) clearInterval(fetchTimer);
    
    fetchOCs();
    startRefreshProgressBar(REFRESH_MS);
    
    fetchTimer = setInterval(() => {
        fetchOCs();
        startRefreshProgressBar(REFRESH_MS);
    }, REFRESH_MS);
}

function formatTimeLeft(seconds) {
    if (seconds <= 0) return "Ready!";
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    return `${h}h ${m}m remaining`;
}

async function fetchOCs() {
    if (!myKey) return;
    try {
        const res = await fetch(`/api/ocs?apiKey=${myKey}`);
        const data = await res.json();
        
        if (data.error) {
            document.getElementById("oc-container").innerHTML = `<div style="color:var(--red); padding:20px; font-weight: bold; text-align: center;">${data.error}</div>`;
            return;
        }

        renderOCs(data.crimes);
    } catch (e) {
        console.error("Failed to load OCs", e);
    }
}

function renderOCs(crimes) {
    const container = document.getElementById("oc-container");
    container.innerHTML = "";
    
    // Filter out completed/failed/expired
    const activeCrimes = crimes.filter(c => !["successful", "failure", "expired", "completed"].includes(c.status));
    
    if (!activeCrimes || activeCrimes.length === 0) {
        container.innerHTML = `<div style='color:var(--text-dim); padding:10px; font-style: italic; text-align: center;'>No active Organized Crimes found.</div>`;
        return;
    }

    activeCrimes.sort((a, b) => (a.ready_at || 0) - (b.ready_at || 0)).forEach(crime => {
        const card = document.createElement("div");
        card.className = "oc-card";
        
        const now = Math.floor(Date.now() / 1000);
        let timeLeftStr = "";
        let isReady = false;
        
        if (crime.status === "initiated") {
            timeLeftStr = "Initiated!";
            isReady = true;
        } else if (crime.ready_at) {
            let secondsLeft = crime.ready_at - now;
            if (secondsLeft <= 0) {
                timeLeftStr = "Ready!";
                isReady = true;
            } else {
                let h = Math.floor(secondsLeft / 3600);
                let m = Math.floor((secondsLeft % 3600) / 60);
                timeLeftStr = `${h}h ${m}m remaining`;
            }
        } else {
            timeLeftStr = crime.status.charAt(0).toUpperCase() + crime.status.slice(1);
        }
        
        const timeColor = isReady ? 'var(--green)' : 'var(--blue)';
        
        let header = `<h2>
            <span>${crime.crime_name} <span style="font-size: 0.6em; color:var(--text-dim);">[Lvl ${crime.level}]</span></span>
            <span style="color:${timeColor}; font-size:0.85em;">${timeLeftStr}</span>
        </h2>`;
        
        let participantsHtml = `<div class="participant-list">`;
        
        if (crime.slots) {
            crime.slots.forEach(slot => {
                if (!slot.user) {
                    // Empty slot
                    participantsHtml += `
                        <div class="p-card">
                            <div class="p-name" style="color:var(--text-dim);">Empty Slot</div>
                            <div style="font-size:0.85em; color:var(--text-dim); font-weight:bold;">${slot.position}</div>
                        </div>
                    `;
                    return;
                }
                
                let pId = slot.user.id;
                let pName = slot.user.name;
                
                let stateStr = slot.status.charAt(0).toUpperCase() + slot.status.slice(1);
                let issue = false;
                
                if (slot.item_requirement) {
                    if (!slot.item_requirement.is_available) {
                        stateStr = `Needs ${slot.item_requirement.item_name}`;
                        issue = true;
                    } else {
                        stateStr += ` (Has ${slot.item_requirement.item_name})`;
                    }
                }
                if (slot.status.toLowerCase().includes("hospital") || slot.status.toLowerCase().includes("jail")) {
                    issue = true;
                }
                
                participantsHtml += `
                    <div class="p-card ${issue ? 'issue' : 'ready'}">
                        <div class="p-name"><a href="https://www.torn.com/profiles.php?XID=${pId}" target="_blank">${pName} [${pId}]</a></div>
                        <div style="font-size:0.85em; color:var(--text-dim); font-weight:bold;">${slot.position}: ${stateStr}</div>
                    </div>
                `;
            });
        }
        
        participantsHtml += `</div>`;
        card.innerHTML = header + participantsHtml;
        container.appendChild(card);
    });
}

if (myKey) {
    startPolling();
} else {
    openSettings();
}
</script>
</body>
</html>
