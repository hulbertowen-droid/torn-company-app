<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Dashboard | Spider-Verse</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- The Smart Nav Bar -->
    <div class="top-nav">
        <a href="/" class="nav-link">📡 Live Warboard</a>
        <a href="/chain.html" class="nav-link">🔗 Chain Watcher</a>
        <a href="/payout.html" class="nav-link">💰 Payout Calculator</a>
        <a href="/dashboard.html" class="nav-link">🛡️ Alliance Dashboard</a>
        <a href="/recruitment.html" class="nav-link">🎯 Recruitment</a>
        <a onclick="openSettings()" class="nav-link" style="cursor:pointer; border-left: 1px solid #2f3542; border-radius:0;">⚙️ Settings</a>
    </div>

    <h1>Alliance Dashboard</h1>

    <div class="container">
        
        <!-- Member Status & Timelines -->
        <div class="faction-col">
            <h2>Faction Roster</h2>
            <div id="roster-list"><div style="color:var(--text-dim); padding:20px;">Loading Faction Data...</div></div>
        </div>

        <!-- Armory Loans -->
        <div class="faction-col">
            <h2>Armory Loans</h2>
            <div id="loan-error" style="color: var(--red); font-weight: bold; margin-bottom: 10px; display: none;">Warning: API Key does not have Armory access. Cannot fetch loans.</div>
            <div id="loan-list"><div style="color:var(--text-dim); padding:20px;">Loading Armory Data...</div></div>
        </div>

    </div>

<script>
    // --- SMART NAV HIGHLIGHTER ---
    document.addEventListener("DOMContentLoaded", function() {
        let currentUrl = window.location.pathname;
        if (currentUrl === "/index.html") currentUrl = "/"; 
        let links = document.querySelectorAll(".top-nav .nav-link");
        links.forEach(link => {
            link.classList.remove("active"); 
            if (link.getAttribute("href") === currentUrl) link.classList.add("active"); 
        });
    });

    const myKey = localStorage.getItem("warboard_apikey");

    async function loadDashboard() {
        if (!myKey) {
            document.getElementById("roster-list").innerHTML = "<div style='color:var(--red); padding:10px;'>Please set your API key on the Live Warboard settings first.</div>";
            document.getElementById("loan-list").innerHTML = "";
            return;
        }

        try {
            const res = await fetch(`/api/dashboard-data?apiKey=${myKey}`);
            const data = await res.json();

            if (data.error) {
                document.getElementById("roster-list").innerHTML = `<div style='color:var(--red); padding:10px;'>API Error: ${data.error}</div>`;
                return;
            }

            if (data.armoryError) {
                document.getElementById("loan-error").style.display = "block";
                document.getElementById("loan-list").innerHTML = "";
            } else {
                let loanHtml = "";
                if (data.loans && data.loans.length > 0) {
                    data.loans.forEach(loan => {
                        let badgeColor = loan.type === "Armor" ? "var(--blue)" : (loan.type === "Weapon" ? "var(--red)" : "var(--gold)");
                        loanHtml += `
                            <div class="member-card">
                                <div class="card-header">
                                    <div style="font-weight: bold; color: var(--text-main);">${loan.name}</div>
                                    <div style="background: rgba(255,255,255,0.1); border: 1px solid ${badgeColor}; color: ${badgeColor}; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: bold;">${loan.type}</div>
                                </div>
                                <div style="color: var(--text-dim); font-size: 0.9em; margin-top: 5px;">Loaned to: <span style="color: var(--gold); font-weight: bold;">[${loan.loaned_to}]</span></div>
                            </div>
                        `;
                    });
                } else {
                    loanHtml = `<div style="color:var(--text-dim); padding:10px;">No items are currently loaned out.</div>`;
                }
                document.getElementById("loan-list").innerHTML = loanHtml;
            }

            let rosterHtml = "";
            if (data.members) {
                Object.entries(data.members).forEach(([id, m]) => {
                    let activityScore = 0;
                    if (m.timeline && m.timeline.length > 0) {
                        activityScore = m.timeline.reduce((a,b) => a+b, 0);
                    }
                    
                    let actColor = activityScore > 50 ? "var(--green)" : (activityScore > 10 ? "var(--gold)" : "var(--red)");
                    
                    rosterHtml += `
                        <div class="member-card">
                            <div class="card-header">
                                <a class="profile" href="https://www.torn.com/profiles.php?XID=${id}" target="_blank">${m.name}</a>
                                <div style="text-align: right;">
                                    <div style="font-size: 0.8em; color: var(--text-dim);">12h Activity Score</div>
                                    <div style="font-weight: bold; color: ${actColor};">${activityScore}</div>
                                </div>
                            </div>
                            <div class="status">Last Action: <span>${m.last_action?.relative || "Unknown"}</span></div>
                        </div>
                    `;
                });
            }
            document.getElementById("roster-list").innerHTML = rosterHtml;

        } catch (err) {
            console.error(err);
        }
    }

    loadDashboard();
</script>
</body>
</html>
